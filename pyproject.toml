[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-snipe-bot-mcp"
version = "4.0.4"
description = "Solana Sniper Bot MCP Server — control an autonomous Solana trading bot via 281 MCP tools across four modes: Meme sniping, Spot, Perpetuals, and Mirror copy-trading."
readme = "README_pypi.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Solana Sniper Bot", email = "admin@solsniperbot.co"},
]
keywords = ["solana", "sniper", "mcp", "model-context-protocol", "trading", "bot", "pumpfun", "meme-coin", "perpetuals", "futures", "copy-trading", "mirror", "spot", "jupiter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/solara-sniper-bot/MCP"
Repository = "https://github.com/solara-sniper-bot/MCP"
Issues = "https://github.com/solara-sniper-bot/MCP/issues"

[project.scripts]
solana-snipe-bot-mcp = "solana_snipe_bot_mcp.server:main"

[tool.setuptools.packages.find]
include = ["solana_snipe_bot_mcp*"]
